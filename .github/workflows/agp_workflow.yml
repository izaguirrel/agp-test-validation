# Sonatype Guide — Agentic Patches (AGP) Workflow

name: "Sonatype Guide - Agentic Patches"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AGP run mode'
        required: false
        type: string
        default: 'full'
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: agp-workflow
  cancel-in-progress: false

jobs:
  agp:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Sonatype AGP
        uses: sonatype/agp-action@v1
        with:
          mode: ${{ inputs.mode || 'full' }}
          create-pr: 'true'
          dry-run: 'false'
          verbose: ${{ inputs.verbose || 'false' }}
          docker-image: sonatype.repo.sonatype.app/docker-all/sonatype/agp:main-2676-df50a36e
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          github-token: ${{ secrets.AGP_GITHUB_TOKEN }}

        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGP_API_TOKEN: ${{ secrets.AGP_API_TOKEN }}
          AGP_API_URL: https://api.guide-dev.sonatype.dev
